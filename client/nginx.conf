server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # multer accepts uploads up to 7 MB (server/index.js), nginx defaults to 1 MB
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # App.tsx posts to the relative path /api/puzzleme; forward it to the API container
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed build assets never change under the same name
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter needs every unknown path to fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
